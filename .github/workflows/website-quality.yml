name: Website quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: website-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Website quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            qa/package-lock.json

      - name: Install pinned search dependencies
        run: npm ci --no-audit --no-fund

      - name: Install QA dependencies
        working-directory: qa
        run: npm ci --no-audit --no-fund

      - name: Check Python syntax
        run: python3 -m py_compile build.py

      - name: Check JavaScript syntax
        run: node --check web/site.js

      - name: Check search JavaScript syntax
        run: node --check web/search.js

      - name: Build website and fresh search indexes
        run: python3 build.py

      - name: Verify generated files are current
        run: git diff --exit-code -- dist docs/seo-inventory.json docs/redirects.csv

      - name: Validate markup, accessibility, links, metadata, and articles
        run: node qa/validate.cjs

      - name: Validate English and Spanish editions
        run: node qa/bilingual.cjs

      - name: Validate themes and contrast
        run: node qa/theme.cjs

      - name: Install Chromium for search checks
        working-directory: qa
        run: npx playwright install --with-deps --only-shell chromium

      - name: Validate search coverage, behavior, accessibility, and failure guards
        run: node qa/search.cjs
        env:
          SEARCH_VERIFY_DEPLOYMENT: "1"
          SEARCH_PRODUCTION: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          SEARCH_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          SEARCH_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
